{% set alert_class = {'success': 'success', 'danger': 'danger', 'error': 'danger', 'warning': 'warning', 'info': 'info'} %}
{% for category, message in get_flashed_messages(with_categories=true) %}
<div class="alert alert-{{ alert_class.get(category, 'info') }} alert-dismissible fade show" role="alert">
  {{ message }}
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endfor %}
